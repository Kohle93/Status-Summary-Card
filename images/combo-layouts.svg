<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="900" height="300" fill="#15161b"/>

  <text x="215" y="24" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Verbund – Reihe (1×4)</text>
  <rect x="20" y="36" width="390" height="120" rx="18" fill="none" stroke="#3a3c44" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="215" y="170" fill="#787b85" font-size="11" text-anchor="middle">eine einzige Karte</text>

  <!-- 4 Mini-Kacheln in Reihe -->
  <g transform="translate(30,46)">
    <rect width="88" height="100" rx="12" fill="#24262d"/>
