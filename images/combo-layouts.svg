    <path d="M44 24 L56 31 L56 48 L32 48 L32 31 Z" fill="none" stroke="#4caf50" stroke-width="3"/>
    <text x="44" y="72" fill="#ffffff" font-size="11" font-weight="700">Alle Fenster</text>
    <text x="44" y="88" fill="#c9cbd1" font-size="10">geschlossen</text>
  </g>
  <g transform="translate(482,160)">
