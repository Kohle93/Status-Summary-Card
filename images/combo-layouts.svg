    <text x="44" y="68" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">Fenster</text>
    <text x="44" y="84" fill="#c9cbd1" font-size="9" text-anchor="middle">zu</text>
  </g>
  <g transform="translate(222,46)">
