    <line x1="39" y1="41" x2="39" y2="46" stroke="#ffc107" stroke-width="3" stroke-linecap="round"/>
    <line x1="49" y1="41" x2="49" y2="46" stroke="#ffc107" stroke-width="3" stroke-linecap="round"/>
    <text x="44" y="72" fill="#ffffff" font-size="11" font-weight="700">5 Lampen</text>
