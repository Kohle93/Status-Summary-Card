    <text x="44" y="68" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">Batterien</text>
    <text x="44" y="84" fill="#c9cbd1" font-size="9" text-anchor="middle">OK</text>
  </g>

  <text x="690" y="24" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Verbund – Raster (2×2)</text>
  <rect x="470" y="36" width="440" height="240" rx="18" fill="none" stroke="#3a3c44" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="690" y="290" fill="#787b85" font-size="11" text-anchor="middle">ebenfalls eine einzige Karte</text>

  <g transform="translate(482,48)">
