    <line x1="40" y1="39" x2="40" y2="43" stroke="#ffc107" stroke-width="3" stroke-linecap="round"/>
    <line x1="48" y1="39" x2="48" y2="43" stroke="#ffc107" stroke-width="3" stroke-linecap="round"/>
    <text x="44" y="68" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">Lampen</text>
    <text x="44" y="84" fill="#c9cbd1" font-size="9" text-anchor="middle">5 an</text>
  </g>
  <g transform="translate(318,46)">
