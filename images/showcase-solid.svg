<svg viewBox="0 0 940 210" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111318"/>
      <stop offset="100%" stop-color="#1c1e24"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="940" height="210" fill="url(#bg)"/>

  <!-- Card 1: Rollläden -->
  <g transform="translate(20,20)">
    <rect width="210" height="170" rx="16" fill="#24262d"/>
    <circle cx="105" cy="62" r="30" fill="#2d1f45"/>
    <g stroke="#a259ff" stroke-width="5" stroke-linecap="round">
      <line x1="88" y1="48" x2="122" y2="48"/>
      <line x1="88" y1="60" x2="122" y2="60"/>
      <line x1="88" y1="72" x2="122" y2="72"/>
    </g>
    <rect x="86" y="44" width="38" height="34" rx="4" fill="none" stroke="#a259ff" stroke-width="3"/>
    <text x="105" y="130" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">14 Rollläden</text>
    <text x="105" y="150" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">geöffnet</text>
  </g>

  <!-- Card 2: Lampen -->
  <g transform="translate(250,20)">
    <rect width="210" height="170" rx="16" fill="#24262d"/>
    <circle cx="105" cy="62" r="30" fill="#3a2f10"/>
    <circle cx="105" cy="55" r="16" fill="none" stroke="#ffb300" stroke-width="4"/>
    <line x1="99" y1="70" x2="99" y2="78" stroke="#ffb300" stroke-width="4" stroke-linecap="round"/>
    <line x1="111" y1="70" x2="111" y2="78" stroke="#ffb300" stroke-width="4" stroke-linecap="round"/>
    <text x="105" y="130" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">17 Lampen</text>
    <text x="105" y="150" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">eingeschaltet</text>
  </g>

  <!-- Card 3: Fenster & Türen -->
  <g transform="translate(480,20)">
    <rect width="210" height="170" rx="16" fill="#24262d"/>
    <circle cx="105" cy="62" r="30" fill="#1f2d22"/>
    <path d="M105 44 L124 54 L124 76 L86 76 L86 54 Z" fill="none" stroke="#8bc34a" stroke-width="4" stroke-linejoin="round"/>
    <path d="M96 62 L102 68 L114 54" fill="none" stroke="#8bc34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="105" y="130" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">Alle Fenster</text>
    <text x="105" y="150" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">geschlossen</text>
  </g>

  <!-- Card 4: Batterien -->
  <g transform="translate(710,20)">
    <rect width="210" height="170" rx="16" fill="#24262d"/>
    <circle cx="105" cy="62" r="30" fill="#3a2410"/>
    <rect x="90" y="46" width="26" height="34" rx="4" fill="none" stroke="#ff9800" stroke-width="4"/>
    <rect x="98" y="40" width="10" height="7" rx="2" fill="#ff9800"/>
    <rect x="100" y="60" width="6" height="14" fill="#ff9800"/>
    <text x="105" y="130" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">4 Batterien</text>
    <text x="105" y="150" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">schwach</text>
  </g>
</svg>
