<svg viewBox="0 0 940 260" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgphoto" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f3460"/>
      <stop offset="45%" stop-color="#16537e"/>
      <stop offset="75%" stop-color="#2e8b57"/>
      <stop offset="100%" stop-color="#1a5276"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- simulierter unscharfer Dashboard-Hintergrund -->
  <rect width="940" height="260" fill="url(#bgphoto)"/>
  <g filter="url(#blur)">
    <circle cx="150" cy="60" r="90" fill="#ffffff33"/>
    <circle cx="780" cy="200" r="110" fill="#00000033"/>
    <circle cx="500" cy="40" r="70" fill="#ffdd5533"/>
    <circle cx="650" cy="220" r="60" fill="#ff6b6b33"/>
  </g>

  <!-- Glaskarte: horizontal, aktiv -->
  <g transform="translate(40,55)">
    <rect width="260" height="90" rx="14" fill="#000000" opacity="0.32"/>
    <circle cx="55" cy="45" r="26" fill="#ffffff22"/>
    <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
      <line x1="42" y1="34" x2="68" y2="34"/>
      <line x1="42" y1="45" x2="68" y2="45"/>
      <line x1="42" y1="56" x2="68" y2="56"/>
    </g>
    <text x="100" y="42" fill="#ffffff" font-size="17" font-weight="700">3 Fenster offen</text>
    <text x="100" y="63" fill="#ffffffb0" font-size="12">Fenster &amp; Türen · aktiv</text>
  </g>

  <!-- Glaskarte: horizontal, inaktiv -->
  <g transform="translate(340,55)">
    <rect width="260" height="90" rx="14" fill="#000000" opacity="0.32"/>
    <circle cx="55" cy="45" r="26" fill="#ffffff22"/>
    <path d="M55 30 L70 38 L70 55 L40 55 L40 38 Z" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
    <path d="M47 46 L53 52 L64 39" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="100" y="42" fill="#ffffff" font-size="17" font-weight="700">Alle geschlossen</text>
    <text x="100" y="63" fill="#ffffffb0" font-size="12">Fenster &amp; Türen · inaktiv</text>
  </g>

  <!-- Glaskarte: vertikal, klein -->
  <g transform="translate(660,40)">
    <rect width="150" height="120" rx="14" fill="#000000" opacity="0.32"/>
    <circle cx="75" cy="42" r="24" fill="#ffffff22"/>
    <rect x="63" y="30" width="24" height="30" rx="3" fill="none" stroke="#ffffff" stroke-width="4"/>
    <rect x="70" y="25" width="10" height="6" rx="2" fill="#ffffff"/>
    <text x="75" y="90" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">4 Batterien</text>
    <text x="75" y="107" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">schwach</text>
  </g>

  <text x="40" y="235" fill="#ffffffcc" font-size="13" font-style="italic">Transparent-Modus – Karte legt sich mit Blur-Effekt über den Dashboard-Hintergrund</text>
</svg>
