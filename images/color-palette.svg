<svg viewBox="0 0 850 220" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="850" height="220" fill="#15161b"/>
  <text x="425" y="26" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">
    Auswahl an Icon-Farben über den nativen Farbpicker (icon_color_active / icon_color_inactive)
  </text>

  <!-- Reihe 1 -->
  <g transform="translate(25,45)">
    <g><circle cx="20" cy="20" r="18" fill="#f44336"/><text x="20" y="55" fill="#c9cbd1" font-size="10" text-anchor="middle">red</text></g>
    <g transform="translate(90,0)"><circle cx="20" cy="20" r="18" fill="#e91e63"/><text x="20" y="55" fill="#c9cbd1" font-size="10" text-anchor="middle">pink</text></g>
    <g transform="translate(180,0)"><circle cx="20" cy="20" r="18" fill="#9c27b0"/><text x="20" y="55" fill="#c9cbd1" font-size="10" text-anchor="middle">purple</text></g>
    <g transform="translate(270,0)"><circle cx="20" cy="20" r="18" fill="#673ab7"/><text x="20" y="55" fill="#c9cbd1" font-size="10" text-anchor="middle">deep-purple</text></g>
    <g transform="translate(360,0)"><circle cx="20" cy="20" r="18" fill="#3f51b5"/><text x="20" y="55" fill="#c9cbd1" font-size="10" text-anchor="middle">indigo</text></g>
    <g transform="translate(450,0)"><circle cx="20" cy="20" r="18" fill="#2196f3"/><text x="20" y="55" fill="#c9cbd1" font-size="10" text-anchor="middle">blue</text></g>
    <g transform="translate(540,0)"><circle cx="20" cy="20" r="18" fill="#03a9f4"/><text x="20" y="55" fill="#c9cbd1" font-size="10" text-anchor="middle">light-blue</text></g>
    <g transform="translate(630,0)"><circle cx="20" cy="20" r="18" fill="#00bcd4"/><text x="20" y="55" fill="#c9cbd1" font-size="10" text-anchor="middle">cyan</text></g>
    <g transform="translate(720,0)"><circle cx="20" cy="20" r="18" fill="#009688"/><text x="20" y="55" fill="#c9cbd1" font-size="10" text-anchor="middle">teal</text></g>
  </g>

  <!-- Reihe 2 -->
  <g transform="translate(25,130)">
    <g><circle cx="20" cy="20" r="18" fill="#4caf50"/><text x="20" y="55" fill="#c9cbd1" font-size="10" text-anchor="middle">green</text></g>
    <g transform="translate(90,0)"><circle cx="20" cy="20" r="18" fill="#8bc34a"/><text x="20" y="55" fill="#c9cbd1" font-size="10" text-anchor="middle">light-green</text></g>
    <g transform="translate(180,0)"><circle cx="20" cy="20" r="18" fill="#cddc39"/><text x="20" y="55" fill="#c9cbd1" font-size="10" text-anchor="middle">lime</text></g>
    <g transform="translate(270,0)"><circle cx="20" cy="20" r="18" fill="#ffeb3b"/><text x="20" y="55" fill="#c9cbd1" font-size="10" text-anchor="middle">yellow</text></g>
    <g transform="translate(360,0)"><circle cx="20" cy="20" r="18" fill="#ffc107"/><text x="20" y="55" fill="#c9cbd1" font-size="10" text-anchor="middle">amber</text></g>
    <g transform="translate(450,0)"><circle cx="20" cy="20" r="18" fill="#ff9800"/><text x="20" y="55" fill="#c9cbd1" font-size="10" text-anchor="middle">orange</text></g>
    <g transform="translate(540,0)"><circle cx="20" cy="20" r="18" fill="#ff5722"/><text x="20" y="55" fill="#c9cbd1" font-size="10" text-anchor="middle">deep-orange</text></g>
    <g transform="translate(630,0)"><circle cx="20" cy="20" r="18" fill="#795548"/><text x="20" y="55" fill="#c9cbd1" font-size="10" text-anchor="middle">brown</text></g>
    <g transform="translate(720,0)"><circle cx="20" cy="20" r="18" fill="#9e9e9e"/><text x="20" y="55" fill="#c9cbd1" font-size="10" text-anchor="middle">grey</text></g>
  </g>
</svg>
